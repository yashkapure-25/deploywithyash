    <!-- ═══════════════════════════════════════════════

    <style>
      /* ═══ Metropolitan Velocity — Glassmorphism ═══ */
      :root {
        --mv-grey:   #373B3E;
        --mv-black:  #0A0A0A;
        --mv-red:    #D90429;
        --mv-silver: #8D99AE;
        --mv-white:  #EDF2F4;
        --bg-color:   #373B3E;
        --bg-darker:  #25282B;
        --text-color: #EDF2F4;
        --card-bg:    rgba(10, 10, 10, 0.35);
        --card-border: rgba(217, 4, 41, 0.45);
        --nav-bg:     rgba(10, 10, 10, 0.30);
        --gradient-primary:   linear-gradient(135deg, #D90429 0%, #8D99AE 100%);
        --gradient-secondary: linear-gradient(135deg, #D90429 0%, #EDF2F4 100%);
        --gradient-purple:    linear-gradient(135deg, #D90429 0%, #8D99AE 100%);
        --gradient-orange:    linear-gradient(135deg, #D90429 0%, #8D99AE 100%);
        --gradient-rainbow:   linear-gradient(135deg, #D90429 0%, #8D99AE 55%, #EDF2F4 100%);
        --shadow-glow: 0 0 24px rgba(217, 4, 41, 0.5);
        --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.65);
      }
      html.light {
        --bg-color:   #EDF2F4;
        --bg-darker:  #D1D8DF;
        --text-color: #0A0A0A;
        --card-bg:    rgba(255, 255, 255, 0.45);
        --card-border: rgba(217, 4, 41, 0.25);
        --nav-bg:     rgba(255, 255, 255, 0.30);
        --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.12);
        --shadow-glow: 0 0 18px rgba(217, 4, 41, 0.25);
      }

      /* ── Base ────────────────────────────────── */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        background-image: linear-gradient(145deg, #373B3E 0%, #25282B 60%, #1A1C1E 100%);
        background-attachment: fixed;
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      html.light body {
        background-image: linear-gradient(145deg, #EDF2F4 0%, #D1D8DF 100%);
      }

      /* ── Skip Navigation (Accessibility) ──────── */
      .skip-nav {
        position: absolute; top: -100%; left: 0;
        background: #D90429; color: #EDF2F4;
        padding: 0.5rem 1rem; z-index: 9999;
        font-weight: 700; transition: top 0.2s; border-radius: 0 0 8px 0;
      }
      .skip-nav:focus { top: 0; }

      /* ── iOS 26 Glassmorphism Navbar ────────── */
      /* At top: navbar is invisible — merges into hero */
      .nav-glass {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-bottom: 0.5px solid transparent;
        box-shadow: none;
        transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease, backdrop-filter 0.45s ease;
      }
      /* On scroll: glass pane materialises */
      .nav-glass.scrolled {
        background: rgba(10, 10, 10, 0.60);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border-bottom-color: rgba(217, 4, 41, 0.45);
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.45);
      }
      html.light .nav-glass {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-bottom-color: transparent;
      }
      html.light .nav-glass.scrolled {
        background: rgba(255, 255, 255, 0.70);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border-bottom-color: rgba(217, 4, 41, 0.35);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
      }
      /* Mobile: always transparent (already handled above but explicit) */
      @media (max-width: 767px) {
        .nav-glass,
        .nav-glass.scrolled {
          background: transparent !important;
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          border-bottom: none !important;
          box-shadow: none !important;
        }
      }

      /* ── Glassmorphism Cards ───────────────────── */
      .glass-card {
        background: rgba(10, 10, 10, 0.35);
        backdrop-filter: blur(15px) saturate(160%);
        -webkit-backdrop-filter: blur(15px) saturate(160%);
        border: 0.5px solid rgba(141, 153, 174, 0.18);
        border-top-color: rgba(141, 153, 174, 0.35);
        border-left-color: rgba(141, 153, 174, 0.25);
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.07),
          inset 0 0 40px rgba(55, 59, 62, 0.20);
        border-radius: 20px;
        transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .glass-card:hover {
        background: rgba(10, 10, 10, 0.52);
        border-color: rgba(217, 4, 41, 0.65);
        border-top-color: rgba(217, 4, 41, 0.85);
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(217, 4, 41, 0.15),
          inset 0 0 40px rgba(217, 4, 41, 0.06),
          0 0 30px rgba(217, 4, 41, 0.28);
        transform: translateY(-5px);
      }

      html.light .glass-card {
        background: rgba(255, 255, 255, 0.45);
        border: 0.5px solid rgba(141, 153, 174, 0.30);
        border-top-color: rgba(141, 153, 174, 0.50);
        box-shadow: 0 8px 32px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.8);
      }
      html.light .glass-card:hover {
        background: rgba(255, 255, 255, 0.65);
        border-color: rgba(217, 4, 41, 0.55);
        box-shadow: 0 18px 48px rgba(0,0,0,0.12), 0 0 22px rgba(217,4,41,0.20);
      }

      /* ── Text Gradient Utilities ─────────────── */
      .text-gradient {
        background: var(--gradient-secondary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .text-gradient-rainbow {
        background: var(--gradient-rainbow);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% 200%;
        animation: gradient-shift 3s ease infinite;
      }

      .btn-gradient {
        background: rgba(10, 10, 10, 0.80);
        border: 1.5px solid #D90429;
        box-shadow: 0 0 0 rgba(217,4,41,0), inset 0 1px 0 rgba(255,255,255,0.07);
        backdrop-filter: blur(8px);
        transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
      }
      .btn-gradient:hover {
        background: #D90429;
        box-shadow: 0 0 30px rgba(217, 4, 41, 0.65), inset 0 1px 0 rgba(255,255,255,0.12);
      }

      /* micro-pulse on Ignition Red accent elements */
      @keyframes red-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217,4,41,0.45); }
        50%       { box-shadow: 0 0 14px 4px rgba(217,4,41,0.12); }
      }
      .red-pulse { animation: red-pulse 2.5s ease-in-out infinite; }

      /* ── Focus Styles (Accessibility) ──────────── */
      :focus-visible {
        outline: 2px solid #FF6B00;
        outline-offset: 3px;
        border-radius: 4px;
      }

      /* ── Light Mode Text Overrides ──────────── */
      html.light .text-gray-300,
      html.light .text-gray-400 { color: #4B5563; }
      html.light .text-gray-500 { color: #6B7280; }
      html.light .text-white { color: #111827; }
      html.light .hover\:text-white:hover { color: #000000; }
      html.light .bg-white\/5 { background-color: rgba(0, 0, 0, 0.05); }
      html.light .border-white\/10 { border-color: rgba(0, 0, 0, 0.1); }

      /* ── Custom Scrollbar ─────────────────────── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0A0A0A; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #D90429, #8D99AE); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #D90429; }

      /* ── Selection Highlight ─────────────────── */
      ::selection { background: rgba(217,4,41,0.45); color: #EDF2F4; }

      /* ── Image Loading Optimization ──────────── */
      img {
        max-width: 100%;
        height: auto;
      }

      /* ── Reduced Motion Support ───────────────── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
