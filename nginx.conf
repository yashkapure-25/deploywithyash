##############################################################
#  Nginx Configuration — Production-Grade
#  Portfolio: Yash Kapure | AWS & DevOps Engineer
##############################################################

server {
    listen 8080;
    listen [::]:8080;
    server_name yashkapure.dev www.yashkapure.dev localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── Character Encoding ──────────────────────────────────
    charset utf-8;

    # ── Gzip Compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/atom+xml
        application/rss+xml
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ── HTTP Security Headers ────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://cdn.tailwindcss.com
            https://aistudiocdn.com
            https://formspree.io;
        style-src 'self' 'unsafe-inline'
            https://fonts.googleapis.com;
        font-src 'self' data:
            https://fonts.gstatic.com;
        img-src 'self' data: blob:
            https://picsum.photos
            https://media.licdn.com
            https://yashkapure.dev;
        connect-src 'self'
            https://formspree.io
            https://api.formspree.io;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self' https://formspree.io;
        object-src 'none';
        upgrade-insecure-requests;
    " always;

    # ── Cache Control — Static Assets ───────────────────────
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Cache Control — HTML (No-Cache for SPA) ─────────────
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
    }

    # ── Sitemap & Robots ─────────────────────────────────────
    location = /sitemap.xml {
        add_header Content-Type "application/xml";
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        add_header Content-Type "text/plain";
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── PDF Resume ───────────────────────────────────────────
    location ~* \.pdf$ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=604800";
    }

    # ── SPA Fallback (React Router / Single Page App) ────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Block Sensitive Files ────────────────────────────────
    location ~ /\.(env|git|gitignore|dockerignore) {
        deny all;
        return 404;
    }

    location ~ /node_modules {
        deny all;
        return 404;
    }

    # ── Error Pages ──────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
